experiments:
  exp1_ci:
    seeds: [11, 17, 23]
    hardware:
      profiler_batches: 50
    dataset:
      hf_repo: timm/mini-imagenet
      img_size: 128
    training:
      epochs: 2
      batch: 256
      lr: 1.5e-4
      wd: 0.02
      ema: 0.9999
    eval:
      n_gen: 2000
      ddim_steps: 20
    asserts:
      fid_epoch1_lt: 400
    model:
      type: fft_dit
      params:
        sample_size: 128
        patch_size: 16
        in_channels: 3
        hidden_size: 384
        depth: 4
        num_heads: 6
        adapter_rank: 16
