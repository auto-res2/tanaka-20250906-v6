[project]
name = "fft-dit-experiments"
version = "0.2.0"
description = "Re-implementation of FFT-DiT experiments (refactored)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2,<2.9",
    "torchvision>=0.17,<0.21",
    "diffusers>=0.33,<0.36",
    "torch-fidelity>=0.3,<1.0",
    "datasets>=4.0,<4.2",
    "accelerate>=1.5,<1.9",
    "tqdm",
    "pyyaml",
    "matplotlib",
    "seaborn",
    "numpy",
    "requests",
]

[tool.setuptools.packages.find]
where = ["src"]
